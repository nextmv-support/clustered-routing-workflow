type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
files:
  - main.py
python:
  pip-requirements: requirements.txt
configuration:
  content:
    format: "multi-file"
    multi-file:
      input:
        path: "inputs/"
      output:
        solutions: "solutions/"
        statistics: "statistics.json"
        assets: "assets.json"
  options:
    format: ["--{{name}}", "{{value}}"]
    items:
      - name: provider
        option_type: string
        default: scip
        additional_attributes:
          values:
            - scip
            - highs
        ui:
          control_type: select
          display_name: "Solver Provider"
      - name: cluster
        option_type: int
        default: 5
        additional_attributes:
          min: 1
          max: 15
          step: 1
        ui:
          control_type: slider
          display_name: "Number of clusters"
      - name: duration
        option_type: int
        default: 60
        ui:
          control_type: input
          display_name: Duration (seconds)
