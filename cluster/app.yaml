type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
files:
  - main.py
python:
  pip-requirements: requirements.txt
configuration:
  content:
    format: "multi-file"
    multi-file:
      input:
        path: "inputs/"
      output:
        solutions: "solutions/"
        statistics: "statistics.json"
        assets: "assets.json"
  options:
    format: ["--{{name}}", "{{value}}"]
